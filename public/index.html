<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bozorcha — onlayn marketplace</title>

<body>

  <main id="app" class="wrap" aria-live="polite"></main>

      <span>© <span id="year"></span> Bozorcha</span>
      <span>Sotuvchi bo'lish: <a href="#/register?role=seller">do'kon oching</a></span>
